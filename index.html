<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUVAT — projectile motion for A-level</title>
<meta name="description" content="An interactive projectile motion playground for A-level Physics and Maths. The idealised model: no air resistance, no wind, uniform g.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'><path d='M3 26 Q15 -8 27 26' fill='none' stroke='%23ea580c' stroke-width='3' stroke-linecap='round'/></svg>">
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 30 30" aria-hidden="true">
        <path d="M3 26 Q15 -8 27 26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" style="color:var(--accent)"/>
        <circle cx="27" cy="26" r="3.6" fill="var(--accent)"/>
      </svg>
      <span>Suvat</span>
    </div>

    <div class="pick">
      <label for="scenario">Scenario</label>
      <select id="scenario"></select>
    </div>

    <div class="top-right">
      <button class="tbtn" id="working-btn" aria-pressed="true">Working</button>
      <button class="tbtn" id="theme-btn">Light</button>
    </div>
  </header>

  <div class="main" id="main" data-working="on">

    <aside class="col controls" aria-label="Values">
      <p class="note" id="scenario-note"></p>
      <div id="fields"></div>

      <div class="cgroup">
        <h2 class="ctitle">Gravitational field strength</h2>
        <div class="chips" id="g-chips"></div>
      </div>

      <div class="cgroup">
        <h2 class="ctitle">Show</h2>
        <div class="checks" id="shows"></div>
      </div>
    </aside>

    <section class="stage">
      <div class="canvas-wrap"><canvas id="scene" aria-label="Projectile motion"></canvas></div>

      <div class="graphs">
        <div class="gcell"><canvas id="g-s" aria-label="Displacement against time"></canvas></div>
        <div class="gcell"><canvas id="g-v" aria-label="Velocity against time"></canvas></div>
        <div class="gcell"><canvas id="g-a" aria-label="Acceleration against time"></canvas></div>
      </div>

      <div class="readouts" id="readouts"></div>

      <div class="transport">
        <button class="play" id="play" aria-label="Pause">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" aria-label="Time">
        <div class="t-read" id="t-read">t = 0.00 s</div>
        <button class="tbtn" id="reset">Reset</button>
      </div>
    </section>

    <aside class="col working" id="working" aria-label="Working"></aside>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
